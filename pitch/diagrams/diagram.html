<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Airbag LP Diagrams</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  @font-face { font-family: Virgil; src: url("https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Virgil.woff2") format("woff2"); }
  html, body { margin: 0; background: #fff; }
  #stage { position: relative; background: #fff; overflow: hidden; }
  svg { position: absolute; inset: 0; }
  .t { position: absolute; font-family: Virgil, cursive; color: #1e1e1e; white-space: pre; line-height: 1.2; transform: translate(-50%, -50%); text-align: center; }
  .k { position: absolute; transform: translate(-50%, -50%); color: #1e1e1e; font-size: 20px; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"><svg id="svg"></svg></div>
<script>
const RED = "#b8321f", INK = "#1e1e1e", GREY = "#9a9a9a";
const which = new URLSearchParams(location.search).get("d") || "concept";
const stage = document.getElementById("stage"), svg = document.getElementById("svg");
let rc;
let seed = 7;
const opt = (o = {}) => ({ roughness: 1.1, bowing: 1.2, strokeWidth: 1.5, stroke: INK, seed: seed++, ...o });

function size(w, h) {
  stage.style.width = w + "px"; stage.style.height = h + "px";
  svg.setAttribute("width", w); svg.setAttribute("height", h);
  rc = rough.svg(svg);
}
const add = (n) => (svg.appendChild(n), n);
function text(x, y, s, px = 16, o = {}) {
  const d = document.createElement("div");
  d.className = "t"; d.textContent = s;
  d.style.left = x + "px"; d.style.top = y + "px"; d.style.fontSize = px + "px";
  if (o.color) d.style.color = o.color;
  if (o.align === "left") { d.style.transform = "translate(0,-50%)"; d.style.textAlign = "left"; }
  if (o.bg) { d.style.background = "#fff"; d.style.padding = "0 4px"; }
  stage.appendChild(d);
}
function tex(x, y, s, px = 20) {
  const d = document.createElement("div");
  d.className = "k"; d.style.left = x + "px"; d.style.top = y + "px"; d.style.fontSize = px + "px";
  katex.render(s, d, { throwOnError: false });
  stage.appendChild(d);
}
function box(x, y, w, h, label, px = 15, o = {}) {
  add(rc.rectangle(x, y, w, h, opt(o)));
  if (label) text(x + w / 2, y + h / 2, label, px, { color: o.textColor });
}
function stack(x, y, w, labels, o = {}) {
  labels.forEach((l, i) => box(x, y + i * 22, w, 22, l, 12, o));
}
function person(x, y, label, s = 1) {
  add(rc.circle(x, y - 38 * s, 34 * s, opt({ fill: INK, fillStyle: "solid", roughness: 0.6 })));
  add(rc.path(`M ${x - 36 * s} ${y + 34 * s} C ${x - 36 * s} ${y - 14 * s}, ${x + 36 * s} ${y - 14 * s}, ${x + 36 * s} ${y + 34 * s} Z`,
    opt({ fill: INK, fillStyle: "solid", roughness: 0.6 })));
  text(x, y + 52 * s, label, 15);
}
function head(p, q, color) {
  const a = Math.atan2(p[1] - q[1], p[0] - q[0]), L = 13, s = 0.45;
  add(rc.line(p[0], p[1], p[0] - L * Math.cos(a - s), p[1] - L * Math.sin(a - s), opt({ stroke: color, roughness: 0.5 })));
  add(rc.line(p[0], p[1], p[0] - L * Math.cos(a + s), p[1] - L * Math.sin(a + s), opt({ stroke: color, roughness: 0.5 })));
}
// points: [[x,y],...]; o: {red, dashed, both}
function arrow(pts, o = {}) {
  const color = o.red ? RED : o.grey ? GREY : INK;
  const st = opt({ stroke: color, strokeWidth: o.red ? 2.4 : 1.5, roughness: 0.9 });
  if (o.dashed) st.strokeLineDash = [8, 7];
  add(pts.length === 2 ? rc.line(...pts[0], ...pts[1], st) : rc.curve(pts, st));
  if (!o.none) head(pts[pts.length - 1], pts[pts.length - 2], color);
  if (o.both) head(pts[0], pts[1], color);
}
function logo(x, y, s) { // Airbag pixel mark
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const px = ["..XXXX..", ".XXXXXX.", "XXXXXXXX", "XXXXXXXX", "XXXXXXXX", "XXXXXXXX", ".XXXXXX.", "..XXXX.."];
  let h = `<rect x="${x}" y="${y}" width="${11 * s}" height="${11 * s}" fill="#fbf6ea" stroke="${INK}" stroke-width="${s * 0.7}"/>`;
  px.forEach((r, j) => [...r].forEach((c, i) => {
    if (c === "X") h += `<rect x="${x + (i + 1.5) * s}" y="${y + (j + 1.5) * s}" width="${s}" height="${s}" fill="${(i + j) % 3 === 0 ? "#b8321f" : "#e4412a"}"/>`;
  }));
  h += `<rect x="${x + 3.5 * s}" y="${y + 3.5 * s}" width="${s}" height="${s}" fill="#fbf6ea"/>`;
  g.innerHTML = h; svg.appendChild(g);
}
function icon(x, y, d, name) { // brand logo centred on (x, y), d px wide
  const im = document.createElementNS("http://www.w3.org/2000/svg", "image");
  im.setAttribute("href", `logos/${name}.svg`);
  im.setAttribute("x", x - d / 2); im.setAttribute("y", y - d / 2);
  im.setAttribute("width", d); im.setAttribute("height", d);
  svg.appendChild(im);
}
function wide(x, y, w, h, name) { // wordmark logo centred on (x, y)
  const im = document.createElementNS("http://www.w3.org/2000/svg", "image");
  im.setAttribute("href", `logos/${name}.svg`);
  im.setAttribute("x", x - w / 2); im.setAttribute("y", y - h / 2);
  im.setAttribute("width", w); im.setAttribute("height", h);
  svg.appendChild(im);
}
function bubble(x, y, w, h, tailX) {
  add(rc.path(`M ${x} ${y} L ${x + w} ${y} L ${x + w} ${y + h} L ${tailX + 14} ${y + h} L ${tailX} ${y + h + 26} L ${tailX - 2} ${y + h} L ${x} ${y + h} Z`, opt()));
}

// ─────────────────────────────── concept ───────────────────────────────
function concept() {

  text(470, 120, "Airbag LP Cover Concept", 40);

  person(190, 500, "Buyer");

  text(140, 324, "wstETH/WETH LP", 14);

  logo(436, 241, 7);

  // Uniswap v4 pool (bottom centre)
  icon(470, 625, 76, "uni");
  text(470, 684, "v4 pool + CoverHook", 16);

  // Underwriter (right)
  person(760, 500, "Underwriter");
  box(670, 240, 180, 70, "", 13);
  icon(694, 275, 26, "usdc");
  text(772, 266, "1M USDC backing", 13);
  text(772, 286, "(stays in own wallet)", 12);
  wide(760, 218, 74, 25, "aqua");
  arrow([[760, 445], [760, 312]], { none: true, dashed: true, grey: true });
  text(796, 378, "approved", 12, { color: GREY });

  // flows
  arrow([[225, 445], [300, 320], [430, 282]]);
  text(300, 290, "③ pay premium", 14, { bg: true });
  arrow([[432, 305], [300, 360], [238, 455]], { grey: true, dashed: true });
  text(355, 375, "cover note", 13, { bg: true, color: "#555" });

  arrow([[668, 275], [520, 275]], { both: false });
  text(615, 258, "① open market", 12);

  arrow([[200, 560], [255, 625], [426, 627]]);
  text(255, 618, "② add liquidity", 14, { bg: true });

  arrow([[514, 612], [640, 520], [500, 326]], { dashed: true });
  text(675, 600, "④ IL measured\non-chain", 13);

  // ⑤ Airbag orders the pull; ⑥ USDC goes from the underwriter's backing straight to the buyer
  arrow([[500, 236], [605, 196], [700, 238]], { dashed: true });
  text(610, 180, "⑤ IL > 0.5%: orders Aqua.pull", 12);
  arrow([[700, 470], [470, 420], [252, 482]], { red: true });
  text(470, 445, "⑥ USDC paid out", 16, { color: RED, bg: true });
  text(470, 470, "no claim form, no admin", 12, { color: GREY });
}

  arrow([[1210, 590], [1210, 542]], { both: true });

  // ③ bind
  arrow([[118, 510], [400, 482], [560, 372], [780, 368], [860, 344]], { grey: true });

  // ILTrigger reads hook
  arrow([[895, 228], [760, 196], [580, 196], [444, 300]], { dashed: true });

  arrow([[740, 558], [740, 345]], { grey: true });

  // ④ payout (red)

  text(600, 830, "④ wstETH −40% vs WETH  →  IL 3.18%  →  Aqua.pull $2,675 USDC to buyer", 15, { color: RED, bg: true });

  // example box (bottom-left)
  box(40, 860, 400, 120, "", 13);
  text(240, 882, "Example", 15);
  text(240, 933, "LP $100k  ·  cover = 100k × (5% − 0.5%) = $4,500\nprice moves → IL 3.18% = $3,175 loss\npaid $2,675  (LP keeps only the first 0.5%)", 12);
}

// ─────────────────────────── depeg: shared bits ───────────────────────────
function priceChart(x, y, w, h, o = {}) { // hand-drawn USDG/USD line that falls through the $0.97 band
  const pegY = y + h * 0.18, trigY = y + h * 0.45;
  add(rc.line(x, y + h, x + w, y + h, opt({ roughness: 0.6 })));
  add(rc.line(x, y, x, y + h, opt({ roughness: 0.6 })));
  add(rc.line(x, pegY, x + w, pegY, opt({ stroke: GREY, strokeLineDash: [4, 5], roughness: 0.4 })));
  add(rc.line(x, trigY, x + w, trigY, opt({ stroke: RED, strokeLineDash: [6, 5], roughness: 0.4 })));
  text(x - 24, pegY, "$1.00", 11, { color: GREY });
  text(x - 24, trigY, "$0.97", 11, { color: RED });
  const f = (a, b) => [x + w * a, y + h * b];
  add(rc.curve([f(0, 0.2), f(0.2, 0.16), f(0.38, 0.21), f(0.55, 0.18), f(0.68, 0.62), f(0.8, 0.82), f(1, 0.74)],
    opt({ strokeWidth: 2.2, roughness: 0.8 })));
  if (o.mark) text(x + w + 22, y + h * 0.72, "$0.92", 12, { color: RED });
}
